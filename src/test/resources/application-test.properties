spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/easytask_test}
spring.datasource.username=${TEST_DB_USERNAME:easytask}
spring.datasource.password=${TEST_DB_PASSWORD:easytask}

spring.flyway.clean-disabled=false

easytask.storage.dir=${java.io.tmpdir}/easytask-test-attachments
easytask.ratelimit.enabled=false

# Push is always disabled in tests, even if FIREBASE_CREDENTIALS is set on the machine
easytask.firebase.credentials=
