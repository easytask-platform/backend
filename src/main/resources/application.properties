spring.application.name=backend

# Bind to the platform-provided port in production (Render/Heroku set $PORT); default 8080 locally.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/easytask}
spring.datasource.username=${DB_USERNAME:easytask}
spring.datasource.password=${DB_PASSWORD:easytask}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

easytask.jwt.secret=${JWT_SECRET:ZWFzeXRhc2stZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi0wMDE=}
easytask.jwt.access-token-ttl=${JWT_ACCESS_TTL:15m}
easytask.refresh-token-ttl=${REFRESH_TTL:14d}
easytask.password-reset-ttl=${PASSWORD_RESET_TTL:30m}
easytask.invite-ttl=${INVITE_TTL:7d}
easytask.storage.dir=${STORAGE_DIR:./data/attachments}
easytask.seed.demo-data=${SEED_DEMO_DATA:false}
# One-shot DESTRUCTIVE production reseed: wipes all org data and seeds
# "Easy Task Org" (see EasyTaskReseedInitializer). Guarded so it runs once —
# skips when that org already exists. Set EASYTASK_RESEED=true to trigger.
easytask.reseed=${EASYTASK_RESEED:false}
easytask.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
easytask.firebase.credentials=${FIREBASE_CREDENTIALS:}

# Brevo transactional email HTTP API — sends over HTTPS (port 443), which is
# NOT blocked by hosts that block outbound SMTP ports (e.g. Render). When
# BREVO_API_KEY is set it takes precedence over SMTP. BREVO_SENDER_EMAIL must
# be a Brevo-verified sender. See MailerConfiguration.
easytask.brevo.api-key=${BREVO_API_KEY:}
easytask.brevo.sender-email=${BREVO_SENDER_EMAIL:}
easytask.brevo.sender-name=${BREVO_SENDER_NAME:EasyTask}

# Mail (D23): SMTP credentials come ONLY from env (SPRING_MAIL_USERNAME /
# SPRING_MAIL_PASSWORD = Gmail App Password, see backend/.mail.env). Used only
# when BREVO_API_KEY is absent; when both are absent the logging mailer runs.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
